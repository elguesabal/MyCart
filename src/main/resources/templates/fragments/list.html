<div class="relative" th:fragment="list">
	<div class="rounded-3xl border border-gray-200 bg-white p-6 shadow-xl">
		<div class="flex items-center justify-between">
			<div>
				<p class="text-sm text-gray-500" th:text="${cart.name}"></p>
				<h2 class="mt-1 text-2xl font-bold" th:text="${cart.description}"></h2>
			</div>
			<div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-50 text-2xl">
				🛒
			</div>
		</div>
		<div class="mt-6 space-y-3">
			<div class="flex items-center gap-3 rounded-xl bg-gray-50 p-4">
				<div class="flex h-5 w-5 items-center justify-center rounded-md border-2 border-blue-500">
					<span class="text-xs text-blue-600">✓</span>
				</div>
				<span class="font-medium">Arroz</span>
				<span class="ml-auto text-sm text-gray-400">2 kg</span>
			</div>
			<div class="flex items-center gap-3 rounded-xl bg-gray-50 p-4">
				<div class="h-5 w-5 rounded-md border-2 border-gray-300"></div>
				<span class="font-medium">Leite</span>
				<span class="ml-auto text-sm text-gray-400">3 un.</span>
			</div>
			<div class="flex items-center gap-3 rounded-xl bg-gray-50 p-4">
				<div class="h-5 w-5 rounded-md border-2 border-gray-300"></div>
				<span class="font-medium">Café</span>
				<span class="ml-auto text-sm text-gray-400">500 g</span>
			</div>
			<div class="flex items-center gap-3 rounded-xl bg-gray-50 p-4">
				<div class="h-5 w-5 rounded-md border-2 border-gray-300"></div>
				<span class="font-medium">Ovos</span>
				<span class="ml-auto text-sm text-gray-400">12 un.</span>
			</div>
		</div>
		<div class="mt-6 flex items-center justify-between border-t border-gray-100 pt-5">
			<span class="text-sm text-gray-500">1 de 4 itens</span>
			<span class="font-semibold text-blue-600">25% concluído</span>
		</div>
	</div>
</div>
