<div class="rounded-3xl border border-gray-200 bg-white p-6 shadow-xl" th:fragment="list">
	<div class="flex items-center justify-between gap-3">
		<h2 class="mt-1 text-2xl font-bold" th:text="${cart.name}"></h2>
		<div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-50 text-2xl">
			🛒
		</div>
	</div>
	<div class="mt-6 space-y-3" th:each="item : ${cart.items}">
		<div class="flex items-center gap-3 rounded-xl bg-gray-50 p-4">
			<div class="flex h-5 w-5 items-center justify-center rounded-md border-2" th:classappend="${item.checked} ? 'border-blue-500' : 'border-gray-300'">
				<span class="text-xs text-blue-600" th:if="${item.checked}">✓</span>
			</div>
			<span class="font-medium" th:text="${item.name}"></span>
			<div class="ml-auto text-sm text-gray-400">
				<span th:text="${item.quantity}"></span>
				<span th:text="${item.unit}"></span>
			</div>
		</div>
	</div>
	<div class="mt-6 flex items-center justify-between border-t border-gray-100 pt-5">
		<span class="text-sm text-gray-500"><span th:text="${cart.countItems}"></span> de <span th:text="${cart.countChecked}"></span> itens</span>
		<span class="font-semibold text-blue-600"><span th:text="${cart.percentageChecked}"></span>% concluído</span>
	</div>
</div>
