<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MyCart</title>
	<link rel="stylesheet" th:href="@{/css/output.css}">
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	<script src="/js/axios.js" defer></script>
	<script src="/js/cart/create.js" defer></script>
	<script src="/js/cart/name.js" defer></script>
	<script src="/js/cart/description.js" defer></script>
	<script src="/js/cart/delete.js" defer></script>
	<script src="/js/cart/copy.js" defer></script>
	<script src="/js/item/updateCart.js" defer></script>
	<script src="/js/item/checked.js" defer></script>
	<script src="/js/item/name.js" defer></script>
	<script src="/js/item/quantity.js" defer></script>
	<script src="/js/item/unit.js" defer></script>
	<script src="/js/item/create.js" defer></script>
	<script src="/js/item/delete.js" defer></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
	<div th:replace="~{fragments/header :: header}"></div>
	<main>
		<section class="flex flex-1 flex-col items-center gap-5 p-[5vw] md:px-[10vw]">
			<div class="min-w-0 flex-1 w-full gap-3">
				<input id="cart-name" class="w-full min-w-0 bg-transparent text-3xl font-bold tracking-tight outline-none placeholder:text-gray-400 focus:ring-0 sm:text-4xl" th:value="${cart.name}" th:data-cart-id="${cart.id}" type="text" placeholder="Nome da lista">
				<textarea id="cart-description" class="p-2 my-6 block h-40 w-full resize-none rounded-xl bg-blue-50 text-gray-600 outline-none placeholder:text-gray-400 focus:ring-0" th:text="${cart.description}" th:data-cart-id="${cart.id}" placeholder="Adicione uma descrição para sua lista..." rows="2">
				</textarea>
			</div>
			<div class="flex flex-1 justify-center w-full">
				<div class="w-[90vw] md:w-[80vw]">
					<div th:replace="~{fragments/list :: list}"></div>
				</div>
			</div>
			<button id="copy-url" class="flex justify-center w-full p-[5vw] md:px-[10vw] shrink-0 cursor-pointer rounded-xl border border-green-200 bg-white px-5 py-3 text-sm font-semibold text-green-600 transition hover:bg-green-50 sm:w-auto" th:data-cart-id="${cart.id}" type="button">
				<span>🛒</span> <span>Copiar link da lista</span>
			</button>
			<button id="delete-cart" class="flex justify-center w-full p-[5vw] md:px-[10vw] shrink-0 cursor-pointer rounded-xl border border-red-200 bg-white px-5 py-3 text-sm font-semibold text-red-600 transition hover:bg-red-50 sm:w-auto" th:data-cart-id="${cart.id}" type="button">
				<span>🗑️</span> <span>Excluir lista</span>
			</button>
		</section>
	</main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
