<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MyCart</title>
	<link rel="stylesheet" th:href="@{/css/output.css}">
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	<script src="/js/axios.js" defer></script>
	<script src="/js/list.js" defer></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
	<div th:replace="~{/fragments/header :: header}"></div>
	<main>
		<section class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12 md:py-16">
			<div class="mb-8 flex flex-col gap-5 sm:flex-row sm:items-start sm:justify-between">
				<div class="min-w-0 flex-1">
					<p class="text-sm font-semibold uppercase tracking-wider text-blue-600">Minha lista</p>
					<input id="cart-name" class="mt-2 w-full min-w-0 bg-transparent text-3xl font-bold tracking-tight outline-none placeholder:text-gray-400 focus:ring-0 sm:text-4xl" th:value="${cart.name}" th:data-cart-id="${cart.id}" type="text" placeholder="Nome da lista">
					<!-- List description -->
					<textarea id="cart-description" class="mt-3 block min-h-[48px] w-full resize-none bg-transparent text-gray-600 outline-none placeholder:text-gray-400 focus:ring-0" th:text="${cart.description}" th:data-cart-id="${cart.id}" placeholder="Adicione uma descrição para sua lista..." rows="2">
					</textarea>
				</div>
				<!-- Delete -->
				<button id="delete-cart" class="inline-flex w-full shrink-0 cursor-pointer items-center justify-center gap-2 rounded-xl border border-red-200 bg-white px-5 py-3 text-sm font-semibold text-red-600 transition hover:bg-red-50 sm:w-auto" th:data-cart-id="${cart.id}" type="button">
					<span>🗑️</span>
					<span>Excluir lista</span>
				</button>
			</div>
			<div class="mx-auto max-w-4xl">
				<div th:replace="~{/fragments/list :: list}"></div>
			</div>
		</section>
	</main>
	<div th:replace="~{/fragments/footer :: footer}"></div>
</body>
</html>
